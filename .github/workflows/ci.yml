name: CI - Gothenburg Weather API (Minikube)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Validate FastAPI app
      - name: Validate app startup
        run: |
          python -c "import uvicorn; print('✅ FastAPI startup check passed')"

      # 5️⃣ Generate custom image tag (0.YYYYMMDD.RUN)
      - name: Generate image tag
        run: |
          DATE=$(date +%Y%m%d)
          RUN_NUMBER=${{ github.run_number }}
          IMAGE_TAG=0.$DATE.$RUN_NUMBER
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # 6️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/gothenburg-weather:${{ env.IMAGE_TAG }} .

      # 7️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8️⃣ Push versioned image
      - name: Push Docker image (versioned)
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gothenburg-weather:${{ env.IMAGE_TAG }}

      # 9️⃣ Tag and push as latest
      - name: Tag and push latest
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/gothenburg-weather:${{ env.IMAGE_TAG }} \
          ${{ secrets.DOCKERHUB_USERNAME }}/gothenburg-weather:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gothenburg-weather:latest

      # 🔟 Output final image info
      - name: Output image details
        run: |
          echo "Versioned Image: ${{ secrets.DOCKERHUB_USERNAME }}/gothenburg-weather:${{ env.IMAGE_TAG }}"
          echo "Latest Image: ${{ secrets.DOCKERHUB_USERNAME }}/gothenburg-weather:latest"
