name: CI/CD - Gothenburg Weather API

# Trigger workflow on push to main or pull request
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Run tests (optional)
      - name: Run FastAPI startup test
        run: |
          python -c "import uvicorn; print('✅ FastAPI startup check passed')"

      # 5️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t gothenburg_weather:latest .

      # 6️⃣ Log in to Docker Hub (optional if pushing)
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7️⃣ Push Docker image (optional)
      - name: Push Docker image
        run: |
          docker tag gothenburg_weather:latest ${{ secrets.DOCKERHUB_USERNAME }}/gothenburg_weather:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gothenburg_weather:latest
