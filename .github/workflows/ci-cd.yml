name: CI - Gothenburg Weather API (Minikube)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Python for simple validation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # 3️⃣ Validate FastAPI app
      - name: Validate app startup
        run: |
          python -c "import uvicorn; print('✅ FastAPI startup check passed')"

      # 4️⃣ Build Docker image with unique Git SHA tag
      - name: Build Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/gothenburg-weather:${IMAGE_TAG} .
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      # 5️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6️⃣ Push image to Docker Hub
      - name: Push image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gothenburg-weather:${{ env.IMAGE_TAG }}

      # 7️⃣ Output final image tag
      - name: Output image tag
        run: |
          echo "Image pushed: ${DOCKERHUB_USERNAME}/gothenburg-weather:${IMAGE_TAG}"


